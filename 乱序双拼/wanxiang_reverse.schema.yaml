# Rime schema settings
# encoding: utf-8
schema:
  schema_id: wanxiang_reverse
  name: "万象：拆分与笔画反查"
  version: "LTS"
  author: amzxyz
  description: |
    万象的反查功能模块，方案融合了组字与笔画的能力
engine:
  processors:
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - echo_translator
    - table_translator
  filters:
    - uniquifier

key_binder:
  __include: default:/key_binder?

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"
  delimiter: " '"
  algebra:
    __patch:
      - wanxiang_algebra_lx:/reverse/乱序廿三  #键位方案，可选：全拼、乱序十七、十七优化、乱序二十、乱序廿三、乱序廿四、乱序廿六、乱序手机、原键优化
      - wanxiang_algebra_lx:/reverse/hspvy  #笔画组：全拼 hspzn、乱序十七 hslzy、十七优化 hukfn、乱序二十 hucvn、乱序廿三 hspvy、其余方案 hupvn（随键位切换）

translator:
  dictionary: wanxiang_reverse
  enable_user_dict: false
