# 乱序双拼 · 反查自定义配置
# 位置：用户目录根目录（与 wanxiang_reverse.schema.yaml 同级）。
# 键位方案随主方案切换（set_schema_lx.lua 自动改写），可选：
# 全拼, 乱序十七, 十七优化, 乱序二十, 乱序廿三, 乱序廿四, 乱序廿六, 乱序手机, 原键优化
patch:
  speller/algebra:
    __patch:
      - wanxiang_algebra_lx:/reverse/乱序廿三  #拼音转双拼码（当前键位方案）
      - wanxiang_algebra_lx:/reverse/hspvy  #笔画组：全拼 hspzn、乱序十七 hslzy、十七优化 hukfn、乱序二十 hucvn、乱序廿三 hspvy、其余方案 hupvn（随键位切换）
