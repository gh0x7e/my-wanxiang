    __append:
      - derive|^([A-Z].{1,2})$|$1/|
      # 数字派生，先将整数类派生出英文写法
      - derive/(?<!\d)1([1-9])(?!\d)/'shí'$1/
      - derive/([1-9])0000(?!0)/$1'wàn'/
      - derive/([1-9])000(?!0)/$1'qiān'/
      - derive/([1-9])00(?!0)/$1'bǎi'/
      - derive/([2-9])0(?!0)/$1'shí'/
      - derive/(?<!\d)([2-9])([1-9])(?!\d)/$1'shí'$2/
      - derive/1([4-7|9])/$1'teen'/
      - derive/11/'eleven'/
      - derive/12/'twelve'/
      - derive/13/'thirteen'/
      - derive/15/'fifteen'/
      - derive/18/'eighteen'/
      - derive/0/o/
      - derive/0/O/
      - derive/0/'zero'/
      - derive/1/'one'/
      - derive/10/'ten'/
      - derive/2/'to'/
      - derive/2/'two'/
      - derive/3/'three'/
      - derive/4/'for'/
      - derive/4/'four'/
      - derive/5/'five'/
      - derive/6/'six'/
      - derive/7/'seven'/
      - derive/8/'eight'/
      - derive/9/'nine'/
      - derive/10/'shí'/
      - derive/0/'líng'/
      - derive/1/'yī'/
      - derive/2/'èr'/
      - derive/3/'sān'/
      - derive/4/'sì'/
      - derive/5/'wǔ'/
      - derive/6/'liù'/
      - derive/7/'qī'/
      - derive/8/'bā'/
      - derive/9/'jiǔ'/
      # 符号派生，将编码中的符号，该消失的消失，该转换为名称的转换为名称
      - derive/\+/'plus'/
      - derive/\./'dot'/
      - derive/@/'at'/
      - derive/-/'hyphen'/
      - derive/#/'hash'/
      - derive/#/'number'/
      - derive/#/'sharp'/
      - derive/♯/'sharp'/
      - derive / 'slash'
      - derive/&/'and'/
      - derive/%/'percent'/
